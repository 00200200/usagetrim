name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linter (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests (pytest)
        run: uv run pytest -v

      - name: Verify the installed wheel outside the checkout
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          uv build --wheel
          wheel="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          uv tool run --isolated --from "$wheel" usagetrim demo --json

  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build native menu bar app
        run: bash macos/build.sh
      - name: Verify local app signature
        run: codesign --verify --deep --strict macos/build/UsageTrim.app
