name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linter (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests (pytest)
        run: uv run pytest -v

      - name: Verify the installed wheel outside the checkout
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          uv build --wheel
          wheel="$(realpath dist/*.whl)"
          cd "$(mktemp -d)"
          uv tool run --isolated --from "$wheel" usagetrim demo --json

  windows-companion:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked companion and test dependencies
        run: uv sync --locked --python 3.12 --extra companion --group dev

      - name: Verify Qt runtime and test companion process exit status
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -c "import PySide6, shiboken6; from PySide6.QtWidgets import QApplication; print('PySide6:', PySide6.__version__, 'Shiboken6:', shiboken6.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -X faulthandler -m pytest tests/test_companion_qt.py tests/test_companion_desktop.py -v
          $testExitCode = $LASTEXITCODE
          Write-Host "Companion pytest process exit code: $testExitCode"
          if ($testExitCode -ne 0) { exit $testExitCode }

  execution-portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Native execution, recovery and resource-harness tests
        shell: bash
        run: >-
          uv run --locked --python ${{ matrix.python-version }} python -m pytest -q
          tests/test_execution_contract.py tests/test_execution_artifacts.py
          tests/test_execution_streams.py tests/test_execution_runner.py
          tests/test_execution_shutdown.py tests/test_execution_process.py
          tests/test_benchmark_execution.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --python 3.12

      - name: Check benchmark regressions
        run: uv run --locked usagetrim bench --json --baseline tests/fixtures/benchmarks/baseline.json

  macos-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build native menu bar app
        run: bash macos/build.sh
      - name: Verify local app signature
        run: codesign --verify --deep --strict macos/build/UsageTrim.app
