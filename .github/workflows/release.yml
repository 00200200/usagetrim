name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  python:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies & verify tests
        run: |
          uv sync --all-extras
          uv run pytest -v
          uv run ruff check .
          uv run ruff format --check .

      - name: Check tag matches package version
        run: |
          version="$(uv run python -c 'import usagetrim; print(usagetrim.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          }

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

      # Separate artifact: PyPI must only receive wheels and sdists.
      - name: Pack Claude Desktop extension
        run: mkdir -p mcpb && npx -y @anthropic-ai/mcpb@2.1.2 pack extensions/claude-desktop "mcpb/usagetrim-${GITHUB_REF_NAME#v}.mcpb"

      - uses: actions/upload-artifact@v7
        with:
          name: claude-desktop-extension
          path: mcpb/*.mcpb
          if-no-files-found: error

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build portable app and verify signature
        run: |
          bash macos/build.sh
          codesign --verify --deep --strict macos/build/UsageTrim.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('macos/build/UsageTrim.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert 'UsageTrimExecutable' not in info, 'Release must resolve the current user backend'
          assert (app / 'Contents/Resources/pet-3d.png').is_file()
          PY
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/UsageTrim.app "dist/UsageTrim-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  pypi:
    # Trusted publishing: no API token is stored in this repository. Opt in with the
    # repository variable PUBLISH_PYPI=true once the PyPI publisher is configured.
    if: vars.PUBLISH_PYPI == 'true'
    needs: python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/usagetrim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    needs: [python, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.zip *.mcpb > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
