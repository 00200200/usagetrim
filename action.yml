name: 'usagetrim Context Optimizer & Token Gate'
description: 'Token optimization engine and PR context impact gate for AI coding workflows.'
author: '00200200'
branding:
  icon: 'scissors'
  color: 'green'

inputs:
  command:
    description: 'Command to run through usagetrim'
    required: false
    default: ''
  pr-check:
    description: 'Analyze PR token delta and post summary'
    required: false
    default: 'false'
  max-token-delta:
    description: 'Maximum allowable net token increase before failing'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install usagetrim
      shell: bash
      run: uv pip install --system "$GITHUB_ACTION_PATH"

    - name: Run command with usagetrim
      if: ${{ inputs.command != '' }}
      shell: bash
      env:
        USAGETRIM_COMMAND: ${{ inputs.command }}
      run: usagetrim run -- bash -e -o pipefail -c "$USAGETRIM_COMMAND"

    - name: Analyze PR Token Impact
      if: ${{ inputs.pr-check == 'true' }}
      shell: bash
      env:
        USAGETRIM_MAX_DELTA: ${{ inputs.max-token-delta }}
      run: |
        ARGS=()
        if [ -n "$USAGETRIM_MAX_DELTA" ]; then
          ARGS=(--max-delta "$USAGETRIM_MAX_DELTA")
        fi
        usagetrim pr --markdown "${ARGS[@]}"
