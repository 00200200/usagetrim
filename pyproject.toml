[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usagetrim"
dynamic = ["version"]
description = "Bound AI coding tool output with local compaction, targeted reads, and recoverable context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "00200200" }]
keywords = [
  "token-optimization",
  "claude-code",
  "codex",
  "openai",
  "gemini",
  "mcp",
  "llm",
  "developer-tools",
  "context-window",
  "rate-limit",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "ast-grep-py>=0.41,<1",
  "rich>=13.7.0",
  "tiktoken>=0.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.7.4,<1",
]
mcp = [
  "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/00200200/usagetrim"
Repository = "https://github.com/00200200/usagetrim"
Issues = "https://github.com/00200200/usagetrim/issues"

[project.scripts]
usagetrim = "usagetrim.cli:main"

[tool.hatch.version]
path = "src/usagetrim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usagetrim"]

[tool.hatch.build.targets.wheel.force-include]
"extensions/claude-desktop" = "usagetrim/extensions/claude-desktop"
"plugins/usagetrim/agents" = "usagetrim/agents"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
]
